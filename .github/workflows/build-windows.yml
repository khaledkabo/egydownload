name: Build EGY Download Manager EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build Windows EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name EGY_Download_Manager egy_downloader.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: EGY-Download-Manager-Windows
          path: dist/EGY_Download_Manager.exe
          if-no-files-found: error
