name: Build EGY Download Manager EXE
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install PyInstaller
      run: pip install pyinstaller
    - name: Build EXE
      run: pyinstaller --onefile --noconsole --name "EGY_Download_Manager" egy_downloader.py
    - name: Upload Result
      uses: actions/upload-artifact@v4
      with:
        name: EGY_Downloader_EXE
        path: dist/EGY_Download_Manager.exe
